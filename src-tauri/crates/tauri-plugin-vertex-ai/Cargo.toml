[package]
name = "tauri-plugin-vertex-ai"
version = "0.1.0"
description = "Vertex's AI provider access: requests with keys from the OS keychain, and the model catalog."
authors = ["Type-32"]
edition = "2021"
rust-version = "1.90"
publish = false
links = "tauri-plugin-vertex-ai"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[dependencies]
tauri = "2.12.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-vertex = { path = "../tauri-plugin-vertex" }
tokio = { version = "1", features = ["sync", "macros"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
