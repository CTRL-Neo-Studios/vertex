[package]
name = "tauri-plugin-vertex-git"
version = "0.1.0"
description = "Vertex's Git: the system git, run per workspace, with tokens in the OS keychain."
authors = ["Type-32"]
edition = "2021"
rust-version = "1.90"
publish = false
links = "tauri-plugin-vertex-git"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[dependencies]
tauri = "2.12.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-vertex = { path = "../tauri-plugin-vertex" }
url = "2.5.8"

[dev-dependencies]
uuid = { version = "1.29.0", features = ["v4"] }
