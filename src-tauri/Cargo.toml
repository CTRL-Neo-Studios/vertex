[package]
name = "Vertex"
version = "0.2.0-beta.5"
description = "A General Purpose Markdown Editor."
authors = ["Type-32"]
license = ""
repository = "https://github.com/CTRL-Neo-Studios/vertex"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset", "macos-private-api", "devtools"] }
tauri-plugin-log = { version = "2.10.1", features = [] }
tauri-plugin-decorum = "1.1.1"
tauri-plugin-fs = { version = "2.7.1", features = ["watch"] }
tauri-plugin-dialog = { version = "2.8.4", features = [] }
tauri-plugin-clipboard-manager = { version = "2.5.0", features = [] }
tauri-plugin-opener = { version = "2.7.2", features = [] }
tauri-plugin-os = { version = "2.4.0", features = [] }
tauri-plugin-process = { version = "2.4.0", features = [] }
url = "2.5.8"
tauri-plugin-notification = { version = "2.8.0", features = [] }
rayon = "1.12"
tokio = { version = "1", features = ["sync", "time", "macros"] }
age = "0.12.1"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Already in the tree through the clipboard plugin; used directly for file lists (Copy/Paste in Files).
arboard = "3.7"
fontdb = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri-plugin-single-instance = { version = "2.5.5", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.5.0"
# Rows dragged out of Files to Finder or Explorer, as files.
tauri-plugin-drag = "2.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
# Files' Delete to the Trash, keeping where each item went so Undo can put it back (`trash.rs`).
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSError", "NSString"] }

# The Trash and Recycle Bin, with the listing that restoring needs (`trash.rs`); macOS uses NSFileManager instead.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
trash = "5.3"

[target."cfg(windows)".dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }
